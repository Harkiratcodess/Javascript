<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  
  <header class="topbar">
    <div class="logo">
      <div class="logo-dot"></div>
      Tasks
    </div>
    <div class="topbar-right">
      <span style="font-size:13px;color:var(--text2)">Good morning ☀️</span>
      <div class="avatar">A</div>
    </div>
  </header>

  <div class="app">


    <aside class="sidebar">
      <span class="sidebar-label">Views</span>

      <div class="nav-item active" onclick="setView('today')">
        <span class="nav-icon">📅</span> Today
        <span class="count" id="cnt-today">0</span>
      </div>
      <div class="nav-item" onclick="setView('all')">
        <span class="nav-icon">📋</span> All Tasks
        <span class="count" id="cnt-all">0</span>
      </div>
      <div class="nav-item" onclick="setView('done')">
        <span class="nav-icon">✅</span> Completed
        <span class="count" id="cnt-done">0</span>
      </div>

      <div class="sidebar-divider"></div>
      <span class="sidebar-label">Lists</span>

      <div class="nav-item">
        <span class="nav-icon" style="color:var(--tag-1t)">●</span> Work
      </div>
      <div class="nav-item">
        <span class="nav-icon" style="color:var(--tag-2t)">●</span> Personal
      </div>
      <div class="nav-item">
        <span class="nav-icon" style="color:var(--tag-3t)">●</span> Study
      </div>
    </aside>

    
    <main class="main">

      <div class="page-head">
        <h1 class="page-title" id="pageTitle">Today</h1>
        <span class="page-date" id="pageDate"></span>
      </div>


      <div class="add-row">
        <div class="add-input-wrap">
          <span class="add-icon">＋</span>
          <input
            class="add-input"
            id="taskInput"
            type="text"
            placeholder="Add a new task…"
            autocomplete="off"
          />
        </div>
        <button class="add-btn" onclick="addTask()">Add</button>
      </div>

      
      <div class="progress-row" id="progressRow">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar" style="width:0%"></div>
        </div>
        <span class="progress-text" id="progressText">0 / 0 done</span>
      </div>


      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
        <button class="filter-btn" onclick="setFilter('done', this)">Done</button>
        <button class="filter-btn" onclick="setFilter('high', this)">🔴 High</button>
      </div>


      <div id="taskArea"></div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
